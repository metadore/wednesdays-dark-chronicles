version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: wednesdays-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      POSTGRES_DB: ${DB_NAME:-wednesdays_dark_chronicles}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wednesdays_dark_chronicles}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

